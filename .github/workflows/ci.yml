name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this in step with .fvmrc. fvm itself is not used in CI — it exists
      # to pin the local toolchain; here the version is pinned directly.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory packages/infinity_formats

      # `analyze` staying clean is a hard rule (CLAUDE.md), so it is enforced
      # here rather than left to discipline.
      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # The infinity_formats suite is pure Dart and runs from its own directory
      # under the Dart VM, which is what makes the Flutter-free rule mechanical:
      # a `package:flutter` import fails to compile here and names the file.
      - name: Test infinity_formats
        working-directory: packages/infinity_formats
        run: dart test

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get
      - run: flutter build linux --debug
