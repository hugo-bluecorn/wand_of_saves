name: wand_of_saves
description: "Wand of Saves — a Material 3 saved-game editor for Baldur's Gate: Enhanced Edition."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dart_mappable: ^4.8.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  infinity_formats:
    path: packages/infinity_formats
  # Directly for `@immutable`, on the hand-written sealed types that D9 keeps
  # out of code generation. Already present transitively via flutter_test,
  # which is why it always reports as outdated and cannot be upgraded alone.
  meta: any

dev_dependencies:
  build_runner: ^2.10.2
  dart_mappable_builder: ^4.8.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
